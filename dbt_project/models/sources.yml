version: 2

sources:
  - name: raw
    description: Raw landing schema populated by the Excel ingestion loader.
    schema: raw
    tables:
      - name: bookmaker_bet_dump
        description: Source-shaped monthly bookmaker dump landed without aggressive typing.
        columns:
          - name: ingestion_id
            tests:
              - not_null
              - unique
          - name: source_file
            tests:
              - not_null
          - name: source_row_number
            tests:
              - not_null
          - name: source_uuid
            tests:
              - not_null
