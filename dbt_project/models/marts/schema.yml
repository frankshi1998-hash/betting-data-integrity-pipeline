version: 2

models:
  - name: dim_customers
    description: Normalized customer rollup for the subset of rows with a named customer.
    columns:
      - name: customer_key
        tests:
          - not_null
          - unique
  - name: dim_events
    description: Race-style event rollup keyed by venue, timestamp, and race number.
    columns:
      - name: event_key
        tests:
          - not_null
          - unique
  - name: fct_bets
    description: Bet-level fact table with business keys, duplicate ranking, and quality flags.
    columns:
      - name: bet_record_key
        tests:
          - not_null
          - unique
      - name: bet_business_key
        tests:
          - not_null
      - name: source_uuid
        tests:
          - not_null
  - name: fct_payouts
    description: Non-zero payout rows isolated for settlement and reconciliation work.
    columns:
      - name: payout_record_key
        tests:
          - not_null
          - unique
