name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: xid_go
          POSTGRES_USER: xid_user
          POSTGRES_PASSWORD: xid_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xid_user -d xid_go"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: xid_go
      PGUSER: xid_user
      PGPASSWORD: xid_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do
            sleep 2
          done

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Generate demo workbook
        run: python -m src.data_generation.create_demo_workbook --output-path ci_artifacts/raw/demo_bookmaker_bet_dump.xlsx

      - name: Apply SQL pipeline
        run: python -m src.setup.apply_sql_pipeline

      - name: Load workbook data
        run: python -m src.ingest.load_bookmaker_dump --raw-dir ci_artifacts/raw --replace-files

      - name: Export reporting outputs
        run: python -m src.reporting.export_reporting_views --output-dir ci_artifacts/processed

      - name: dbt debug
        run: dbt debug --project-dir ./dbt_project --profiles-dir ./dbt_project/profiles

      - name: dbt parse
        run: dbt parse --project-dir ./dbt_project --profiles-dir ./dbt_project/profiles

      - name: dbt run
        run: dbt run --project-dir ./dbt_project --profiles-dir ./dbt_project/profiles

      - name: dbt test
        run: dbt test --project-dir ./dbt_project --profiles-dir ./dbt_project/profiles

      - name: Upload reporting artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reporting-outputs
          path: ci_artifacts/processed
          if-no-files-found: error
