services:
  postgres:
    image: postgres:16
    container_name: xid-go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xid_go
      POSTGRES_USER: xid_user
      POSTGRES_PASSWORD: xid_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

